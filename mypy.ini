# mypy configuration for agent-consensus.
# The production modules are fully annotated; tests and tools are checked too
# (including untyped function bodies), so mistakes in the harnesses fail CI.

[mypy]
python_version = 3.11
mypy_path = .
files = .
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True

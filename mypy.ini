# mypy configuration for agent-consensus.
# The production modules are fully annotated; tests and tools are included for
# import checking, but their untyped function bodies stay unchecked.

[mypy]
python_version = 3.11
mypy_path = .
files = agent_consensus.py, ac_config.py, ac_errors.py, ac_engine.py, ac_transports.py, ac_ui.py, tests, tools
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
